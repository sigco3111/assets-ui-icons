{"name":"auto-collect-uiicons","on":{"push":{"paths":["triggers/uiicons-run.txt"]},"workflow_dispatch":{"inputs":{"dry_run":{"description":"list candidates only","required":false,"type":"boolean","default":false},"max_packs":{"description":"packs per run (default 3)","required":false,"type":"string","default":"3"}}}},"concurrency":{"group":"auto-collect-uiicons","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"collect":{"runs-on":"ubuntu-latest","timeout-minutes":40,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/checkout@v4","with":{"repository":"sigco3111/assets-3d-lowpoly-2","path":"src","fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"kill-switch check","run":"test -f triggers/auto-collect-stop.txt && echo 'STOP: kill-switch on' >> $GITHUB_STEP_SUMMARY || true"},{"name":"install pillow","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"pip install -q pillow"},{"name":"transform collect code","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","run":"python3 - <<'PY'\nimport json\nw=json.load(open('src/.github/workflows/auto-collect.yml',encoding='utf-8'))\nrun=[s for s in w['jobs']['collect']['steps'] if s.get('name')=='collect'][0]['run']\nbody=run.split('\\n',1)[1].rsplit('\\nPY',1)[0]\nR=[(\"REPO = 'sigco3111/assets-3d-lowpoly-2'\",\"REPO = 'sigco3111/assets-ui-icons'\"),\n(\"keys=&field_art_type_tid%5B%5D=10&sort_by=' + sort + '&sort_order\",\"keys=' + sort.split('|')[1] + '&field_art_type_tid%5B%5D=9&sort_by=' + sort.split('|')[0] + '&sort_order\"),\n(\"for sort in ['created', 'count']:\",\"for sort in ['created|'+k for k in ['icon','ui','gui','button','hud','interface','cursor']]:\"),\n(\"for pg in range(6):\",\"for pg in range(3):\"),\n(\"'3d,opengameart'\",\"'ui,icons,opengameart'\"),\n(\"kind='3D 모델'\",\"kind='UI·아이콘'\"),\n(\"(blend|obj|fbx|glb|gltf|dae)$', n, re.I) for n in names\",\"(png|jpg|jpeg|gif|webp)$', n, re.I) for n in names\"),\n(\"'3D 파일 없음'\",\"'이미지 파일 없음'\"),\n(\"if size_mb > 700:\",\"if size_mb > 650:\"),\n(\"if not title: title = path.split('/')[-1].replace('-', ' ').title()\",\"if not title: title = path.split('/')[-1].replace('-', ' ').title()\\n    title = re.sub(r'^[\\\\s:：\\\\-–—]+', '', title).strip()\"),\n(\"        if not p['lic']:\\n\",\"        if not re.search(r'(?<![a-z])(icons?|ui|gui|buttons?|hud|interface|cursors?)(?![a-z])', (p['title']+' '+slug).lower()):\\n            log('SKIP not-ui %s' % path); continue\\n        if not p['lic']:\\n\")]\nfor a,b in R:\n    assert body.count(a)==1,(a,body.count(a))\n    body=body.replace(a,b)\nopen('/tmp/collect.py','w',encoding='utf-8').write(body)\nprint('transform ok',len(body))\nPY"},{"name":"collect","if":"hashFiles('triggers/auto-collect-stop.txt') == ''","env":{"DRY":"${{ (github.event_name == 'push' && hashFiles('triggers/uiicons-live.txt') == '') && 'true' || (inputs.dry_run == true && 'true' || 'false') }}","MAXP":"${{ inputs.max_packs || '3' }}","GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 /tmp/collect.py"}]}}}
